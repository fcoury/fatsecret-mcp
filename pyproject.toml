[project]
name = "fatsecret-mcp"
version = "0.2.0"
description = "Curated MCP server for the FatSecret Platform API and member website"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.8,<5",
    "fatsecret==5.0.0",
    "filelock>=3,<4",
    "keyring>=25,<26",
    "mcp>=2,<3",
    "pydantic>=2.7,<3",
]

[project.scripts]
fatsecret-mcp = "fatsecret_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fatsecret_mcp"]

[tool.uv.sources]
fatsecret = { path = "../fatsecret", editable = true }

[dependency-groups]
dev = [
    "basedpyright>=1.28,<2",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src", "../fatsecret/src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
